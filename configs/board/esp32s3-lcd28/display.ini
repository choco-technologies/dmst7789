; Waveshare ESP32-S3-Touch-LCD-2.8: the 2.8" IPS display (ST7789, 240x320, RGB565) on GP-SPI2, the pins from the vendor's demo:
;   SCLK = GPIO40 (PC8), MOSI = GPIO45 (PC13), no MISO, CS = GPIO42 (PC10), D/C = GPIO41 (PC9), RESET = GPIO39 (PC7),
;   backlight = GPIO5 (PA5; on/off here, the board dims it with a PWM).
; GPIO0..15 are port A, 16..31 port B, 32..47 port C, 48 port D of dmgpio (pin=PC10 is GPIO42).
;
; One friends_group: dmdevfs tells every driver of the group about the others, and the friend_role says who is who. The display is the
; last section (the order of the sections is the order of the creation and, reversed, of the teardown). dmgpio and dmspi must be
; loaded, and so must dmdma (the transfers of dmspi go by DMA) - dmdma driver=mcu/esp32s3.ini.
; Splash screen: clear_color is the dark navy of the dmodOS splash background, the logo in the middle comes from $SPLASH_LOGO (dmod-boot puts
; it in /eviews/splash_logo.dmvir). The panel is 240 pixels wide: the logos of dmod-boot up to 234 pixels fit.
; Select this file OR the bare bus of dmspi (lcd_spi.ini), never both.

[lcd_cs]
driver_name=dmgpio
driver_order=2
friends_group=lcd
friend_role=chip_select
pin=PC10
mode=output
state=high

[lcd_dc]
driver_name=dmgpio
driver_order=2
friends_group=lcd
friend_role=dc
pin=PC9
mode=output
state=low

[lcd_reset]
driver_name=dmgpio
driver_order=2
friends_group=lcd
friend_role=reset
pin=PC7
mode=output
state=high

[lcd_backlight]
driver_name=dmgpio
driver_order=2
friends_group=lcd
friend_role=backlight
pin=PA5
mode=output
state=low

[lcd_spi]
driver_name=dmspi
driver_order=2
friends_group=lcd
friend_role=spi
instance=2
role=master
baudrate=40000000
mode=0
nss_mode=soft
sck_pin=40
mosi_pin=45

[lcd]
driver_name=dmst7789
driver_order=3
friends_group=lcd
width=240
height=320
rotation=0
invert=on
rgb_order=rgb
reset=yes
clear_color=0xFF041431
